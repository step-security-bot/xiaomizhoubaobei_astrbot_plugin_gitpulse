$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 32
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 创建codebuddy配置文件夹
                script:
                    - mkdir -p /root/.codebuddy
                    - curl -o /root/.codebuddy/models.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/codebuddy.json
                    - echo "已创建 root/.codebuddy 文件夹并下载 models.json"
              - name: 克隆Astrbot并重新克隆
                script:
                  - git clone https://github.com/AstrBotDevs/AstrBot.git /tmp/astrbot-tmp
                  - cp -r /tmp/astrbot-tmp/astrbot /workspace
                  - rm -rf /tmp/astrbot-tmp
                  - git clone https://github.com/AstrBotDevs/AstrBot.git

main:
      # 同步本仓库代码到 GitHub 镜像仓库（xiaomizhoubaobei/astrbot_plugin_gitpulse），
      # 并开启强制推送（force: true -> git push --force），确保 CNB 侧历史始终覆盖镜像仓库，
      # 即使两侧历史出现分叉（如镜像仓库被外部改动）也能同步成功，不留半同步状态。
      # 说明：Github.yml 密钥仓库提供 GIT_USERNAME / GIT_ACCESS_TOKEN / GIT_EMAIL。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_gitpulse.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                force: true
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}
