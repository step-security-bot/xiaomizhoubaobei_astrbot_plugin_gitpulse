# pre-commit 自动格式化工作流
#
# 目标：把仓库既有的 `.pre-commit-config.yaml` 接入 CI，实现「提交即自动格式化」——
# 开发者本地无需手动执行 `pre-commit run --all-files`，由本工作流负责：
#   1. 运行全部钩子（black / isort / end-of-file-fixer / trailing-whitespace 等）；
#   2. 把支持自动修复的钩子产生的改动**回写**到当前分支；
#   3. 对无法自动修复的钩子（flake8 / mypy / pydocstyle 等）给出明确失败提示。
#
# 行为约定：
# - push(main) / pull_request：均执行；自动修复回写到「本次事件对应的分支」；
# - pull_request：回写 PR 的源分支（head ref），使其后续提交自动合规；
# - fork 发起的 PR：GITHUB_TOKEN 无写权限，自动跳过回写、仅做检查，不报权限错误；
# - 手动触发（workflow_dispatch）：便于在任意分支上按需格式化。
#
# 说明：同仓库分支的回写使用 GitHub 默认的 GITHUB_TOKEN 即可，无需额外 PAT。

name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支并发执行时取消旧任务，避免两次自动修复互相覆盖
concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-commit:
    name: 运行 pre-commit 自动格式化
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 回写修复结果需要可推送的凭据
          fetch-depth: 0
          # PR 事件下检出源分支（head）；其余事件检出事发分支
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pre-commit 钩子环境
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: 安装 pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: 执行 pre-commit（自动修复全部文件）
        id: run
        # `--all-files` 覆盖全仓库；支持自动修复的钩子会把修复直接写入工作区。
        # 本步骤返回非 0 时不立即中断，交由后续步骤判断是否产生了可回写的改动。
        continue-on-error: true
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: 判断是否存在可回写的修复
        id: detect
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到 pre-commit 自动修复，准备回写。"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "未检测到自动修复。"
          fi

      - name: 提交并推送自动修复结果
        if: steps.detect.outputs.changed == 'true'
        env:
          # fork PR 无法向源仓库推送，此时仅提示、不报错
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::该 PR 来自 fork，GITHUB_TOKEN 无写权限，跳过自动回写。"
            git --no-pager diff --stat
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: 应用 pre-commit 自动格式化"
          git push

      - name: 汇总检查结果
        if: steps.run.outcome == 'failure'
        run: |
          # 存在自动修复时，本次失败属「已修复但需重新触发」的正常情况；
          # 无自动修复却失败，说明命中了无法自动修复的钩子，需要人工修正。
          if [ "${{ steps.detect.outputs.changed }}" = "true" ]; then
            echo "::notice::已自动回写格式化结果，请拉取最新提交后重新触发检查。"
            exit 0
          fi
          echo "::error::pre-commit 检测到无法自动修复的问题，请按上方日志手动修正。"
          exit 1
